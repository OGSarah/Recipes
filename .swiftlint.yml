# SwiftLint configuration for Recipes
# Run locally with: swiftlint

included:
  - Recipes

excluded:
  - Recipes/RecipesTests/Support/Fixtures.swift   # long inline JSON literals
  - "**/Preview Content"

opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_filter_count
  - first_where
  - last_where
  - sorted_first_last
  - force_unwrapping
  - explicit_init
  - redundant_nil_coalescing
  - operator_usage_whitespace
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - multiline_arguments
  - toggle_bool

disabled_rules:
  - todo
  - trailing_comma

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 700
  ignore_comment_only_lines: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

force_unwrapping:
  severity: warning

# The codebase indents `case` statements one level inside `switch`.
switch_case_alignment:
  indented_cases: true
